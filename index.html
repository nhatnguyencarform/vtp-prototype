document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

wrap;gap:10px;border-top:1px solid #EFEBE3;padding-top:12px\">\n        <div>Đang nhập <b>{{ t.enteredF }}<\u002Fb> · sau khi khớp còn <b>{{ t.afterF }}<\u002Fb><sc-if value=\"{{ t.over }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#A3261A;font-weight:700\"> — vượt số còn lại, sẽ bị từ chối<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ t.save }}\" style=\"background:#0F6E56;color:#fff;border:none;border-radius:10px;min-height:46px;padding:0 18px;font-size:16px;font-weight:600;cursor:pointer\">Xác nhận khớp<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ err }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:#FBE4E1;color:#A3261A;border-radius:10px;padding:10px 12px;font-weight:600\">{{ err }}<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <\u002Fsc-if>\n    <\u002Fsc-if>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isCongno }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Công nợ\" style=\"max-width:1200px;display:flex;flex-direction:column;gap:16px\">\n    <header><h1 style=\"margin:0;font-size:28px;font-weight:700\">Công nợ<\u002Fh1><div style=\"color:#6B655B\">Ai còn thiếu mình? Mình còn thiếu ai? Khoản nào đến hạn?<\u002Fdiv><\u002Fheader>\n    <div style=\"background:#F4F8FD;border:1px solid #C9D8F0;border-radius:12px;padding:14px 16px;font-size:15px;display:flex;flex-direction:column;gap:4px\">\n      <div style=\"font-weight:700\">Cơ sở tính (đề xuất cho bản thử — chưa chốt với kế toán)<\u002Fdiv>\n      <div>• <b>HĐ đã xuất chưa thu<\u002Fb> = tổng hóa đơn đã phát hành − tiền đã khớp vào hóa đơn đó. Đây là số \"còn thiếu mình\". Quá hạn chỉ khi có hạn thỏa thuận và đã qua ngày.<\u002Fdiv>\n      <div>• <b>Cam kết chưa giao<\u002Fb> = giá trị đơn đã xác nhận − giá trị đã giao. Không phải nợ; không cộng với HĐ chưa thu. Nháp không tính.<\u002Fdiv>\n      <div>• <b>Ứng trước chưa áp HĐ<\u002Fb> = tiền khách đã chuyển, khớp vào đơn như -raw-th style=\"text-align:right;padding:12px 14px;font-size:14px;color:#6B655B;border-bottom:1px solid #E4DFD5\">Đặt mua chưa nhận<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:12px 14px;font-size:14px;color:#6B655B;border-bottom:1px solid #E4DFD5\">Đến hạn tiếp<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody><sc-for list=\"{{ payRows }}\" as=\"p\" hint-placeholder-count=\"2\"><sc-raw-tr sc-camel-on-click=\"{{ p.open }}\" style=\"cursor:pointer\" style-hover=\"background:#FAF8F3\"><sc-raw-td style=\"padding:14px;border-bottom:1px solid #EFEBE3\"><b>{{ p.name }}<\u002Fb><div style=\"font-size:14px;color:#6B655B\">{{ p.typeLabel }}<\u002Fdiv><\u002Fsc-raw-td><sc-raw-td style=\"padding:14px;border-bottom:1px solid #EFEBE3;text-align:right;font-weight:700;white-space:nowrap\">{{ p.payableF }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px;border-bottom:1px solid #EFEBE3;white-space:nowrap\"><div style=\"{{ p.overdueStyle }}\">{{ p.overdueF }}<\u002Fdiv><\u002Fsc-raw-td><sc-raw-td style=\"padding:14px;border-bottom:1px solid #EFEBE3;text-align:right;white-space:nowrap;color:#174EA6\">{{ p.advanceF }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px;border-bottom:1px solid #EFEBE3;text-align:right;white-space:nowrap\">{{ p.unreceivedF }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px;border-bottom:1px solid #EFEBE3;white-space:nowrap\">{{ p.nextDue }}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start\">\n      <div style=\"background:#fff;border:1px solid #E4DFD5;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px\"><div style=\"font-weight:700;font-size:17px\">Khoản nào đến hạn — theo hạn thỏa thuận<\u002Fdiv>\n        <sc-for list=\"{{ dueRows }}\" as=\"x\" hint-placeholder-count=\"3\"><div sc-camel-on-click=\"{{ x.open }}\" style=\"display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid #EFEBE3;padding-top:8px;cursor:pointer;flex-wrap:wrap\"><div><span style=\"font-size:13px;color:#6B655B;font-weight:600\">{{ x.kind }}<\u002Fspan> · <b>{{ x.who }}<\u002Fb><div style=\"font-size:14px;color:#6B655B\">{{ x.what }}<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:8px;align-items:center\"><span style=\"{{ x.chip.style }}\">{{ x.chip.label }}<\u002Fspan><b style=\"white-space:nowrap\">{{ x.amountF }}<\u002Fb><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E4DFD5;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px\"><div style=\"font-weight:700;font-size:17px\">Trễ giao hàng — không phải nợ tiền<\u002Fdiv>\n        <sc-if value=\"{{ hasLateDel }}\" hint-placeholder-val=\"{{ false }}\"><sc-for list=\"{{ lateDelRows }}\" as=\"o\" hint-placeholder-count=\"1\"><div sc-camel-on-click=\"{{ o.open }}\" style=\"border-top:1px solid #EFEBE3;padding-top:8px;cursor:pointer;color:#A3261A;font-weight:600\">{{ o.label }}<\u002Fdiv><\u002Fsc-for><\u002Fsc-if>\n        <sc-if value=\"{{ hasLateDel }}\" hint-placeholder-val=\"{{ true }}\"><\u002Fsc-if>\n        <div style=\"font-size:14px;color:#8A8477\">Khách có thể vừa trễ nhận hàng của mình vừa chưa quá hạn trả — hai việc khác nhau.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isMcp }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Kết nối di động\" style=\"max-width:1000px;display:flex;flex-direction:column;gap:16px\">\n    <header><h1 style=\"margin:0;font-size:28px;font-weight:700\">Kết nối ứng dụng AI trên điện thoại<\u002Fh1><div style=\"color:#6B655B\">Chia sẻ PDF/ảnh từ Zalo vào ứng dụng AI, thêm vài câu tiếng Việt, tạo/sửa nháp trên cùng dữ liệu với web<\u002Fdiv><\u002Fheader>\n    <div style=\"background:#FDEFD5;color:#8A4B00;border-radius:12px;padding:14px 16px;font-weight:600\">Trạng thái: chưa kết nối. Mọi mục dưới đây là thiết kế/đề xuất, chưa phải tích hợp đã kiểm chứng. Đường tải lên trực tiếp trên web vẫn dùng được ngay.<\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E4DFD5;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-weight:700;font-size:17px\">Các bước kết nối (mỗi người một kết nối riêng)<\u002Fdiv>\n      <sc-for list=\"{{ mcpChecks }}\" as=\"c\" hint-placeholder-count=\"5\"><div style=\"display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid #EFEBE3;padding-top:8px;flex-wrap:wrap\"><div><b>{{ c.title }}<\u002Fb><div style=\"font-size:14px;color:#6B655B\">{{ c.status }}<\u002Fdiv><\u002Fdiv><span style=\"{{ c.chip.style }}\">{{ c.chip.label }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;padding-top:6px\"><button sc-camel-on-click=\"{{ unavailable }}\" style=\"background:#fff;border:1px dashed #CFC9BE;border-radius:10px;min-height:44px;padding:0 14px;font-size:15px;font-weight:600;cursor:pointer;color:#6B655B\">Kết nối Mẹ (minh họa)<\u002Fbutton><button sc-camel-on-click=\"{{ unavailable }}\" style=\"background:#fff;border:1px dashed #CFC9BE;border-radius:10px;min-height:44px;padding:0 14px;font-size:15px;font-weight:600;cursor:pointer;color:#6B655B\">Kết nối Bố (minh họa)<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E4DFD5;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px\"><div style=\"font-weight:700;font-size:17px\">Tệp đã tiếp nhận (web &amp; di động)<\u002Fdiv><button sc-camel-on-click=\"{{ goOrders }}\" style=\"background:#0F6E56;color:#fff;border:none;border-radius:10px;min-height:44px;padding:0 14px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap\">Tải lên từ trang đơn hàng →<\u002Fbutton><\u002Fdiv>\n      <sc-for list=\"{{ intakeLog }}\" as=\"a\" hint-placeholder-count=\"2\"><div sc-camel-on-click=\"{{ a.open }}\" style=\"display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid #EFEBE3;padding-top:8px;cursor:pointer;flex-wrap:wrap\"><div><b>{{ a.ref }}<\u002Fb> · {{ a.file }}<div style=\"font-size:14px;color:#6B655B\">{{ a.dateF }} · {{ a.by }} · {{ a.source }} · gắn vào {{ a.orderRef }}<\u002Fdiv><\u002Fdiv><span style=\"{{ a.stChip.style }}\">{{ a.stChip.label }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:14px;color:#8A8477\">Ứng dụng AI chỉ tạo/cập nhật nháp và tra cứu; xác nhận đơn, khớp tiền và sửa tài chính luôn là hành động riêng được máy chủ kiểm tra và ghi tên người làm.<\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isHandoff }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Tài liệu kỹ thuật\" style=\"max-width:900px;display:flex;flex-direction:column;gap:16px\">\n    <header><h1 style=\"margin:0;font-size:28px;font-weight:700\">Tài liệu kỹ thuật (tiếng Anh)<\u002Fh1><div style=\"color:#6B655B\">Dành cho đội triển khai — không cần đọc trong công việc hằng ngày<\u002Fdiv><\u002Fheader>\n    <div style=\"background:#fff;border:1px solid #E4DFD5;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px\">\n      <div><a href=\"https://example.invalid/VTP-implementation-handoff.md\" sc-camel-on-click=\"{{ unavailable }}\" style=\"font-weight:700;font-size:17px\">VTP-implementation-handoff.md<\u002Fa> — screen map, entities, status &amp; correction rules, single-VPS architecture, first build boundary, assumptions, acceptance walkthrough.<\u002Fdiv>\n      <div style=\"font-size:15px;color:#6B655B\">Bản thử này chạy hoàn toàn trên trình duyệt với dữ liệu mẫu lưu cục bộ (\"Lưu thử nghiệm\"). Không phải ERP vận hành: không có máy chủ, tài khoản thật, lưu tệp, sao lưu hay kết nối di động.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!--SCREENS-->\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ preview }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closePreview }}\" style=\"position:fixed;inset:0;background:rgba(20,24,22,.55);z-index:50;display:grid;place-items:center;padding:20px\">\n    <div style=\"background:#fff;border-radius:14px;width:100%;max-width:640px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center\"><b>{{ preview }}<\u002Fb><span style=\"background:#FDEFD5;color:#8A4B00;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600\">Mô phỏng xem trước<\u002Fspan><\u002Fdiv>\n      <div style=\"height:320px;border:2px dashed #CFC9BE;border-radius:10px;display:grid;place-items:center;color:#6B655B;text-align:center;padding:20px\">Bản thử không lưu tệp thật. Khi triển khai, tệp gốc (PDF/ảnh) được lưu trên máy chủ và hiển thị ở đây.<\u002Fdiv>\n      <div style=\"text-align:right\"><button sc-camel-on-click=\"{{ closePreview }}\" style=\"background:#fff;border:1px solid #CFC9BE;border-radius:10px;min-height:44px;padding:0 16px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap\">Đóng<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ hasModal }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;background:rgba(20,24,22,.5);z-index:40;display:grid;place-items:center;padding:16px;overflow:auto\">\n  <div style=\"background:#fff;border-radius:16px;width:100%;max-width:600px;max-height:92vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px;animation:vtpfade .2s ease\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center\"><h2 style=\"margin:0;font-size:20px;font-weight:700\">{{ modalTitle }}<\u002Fh2><button sc-camel-on-click=\"{{ close }}\" aria-label=\"Đóng\" style=\"background:none;border:none;font-size:22px;cursor:pointer;color:#6B655B;min-width:44px;min-height:44px\">×<\u002Fbutton><\u002Fdiv>\n\n    <sc-if value=\"{{ m_draft }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:14px;color:#6B655B\">Chỉ cần khách và một ghi chú ngắn. PO, dòng hàng, giá bổ sung sau.<\u002Fdiv>\n      <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Khách hàng *<\u002Flabel><sc-raw-select name=\"clientId\" value=\"{{ form.clientId }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px;background:#fff\"><option value=\"\">— Chọn khách —<\u002Foption><sc-for list=\"{{ clients }}\" as=\"c\" hint-placeholder-count=\"2\"><option value=\"{{ c.id }}\">{{ c.name }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n      <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Ghi chú đang trao đổi<\u002Flabel><textarea name=\"note\" value=\"{{ form.note }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"3\" placeholder=\"VD: hỏi 1.000 kg quai trắng, giao 2 đợt, giá đang bàn…\" style=\"width:100%;border:1px solid #CFC9BE;border-radius:10px;padding:10px 12px;font-size:16px;resize:vertical\"><\u002Ftextarea><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ m_note }}\" hint-placeholder-val=\"{{ false }}\">\n      <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Nội dung *<\u002Flabel><textarea name=\"text\" value=\"{{ form.text }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"3\" style=\"width:100%;border:1px solid #CFC9BE;border-radius:10px;padding:10px 12px;font-size:16px;resize:vertical\"><\u002Ftextarea><\u002Fdiv>\n      <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Trạng thái chi tiết (tùy chọn)<\u002Flabel><input name=\"substep\" value=\"{{ form.substep }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ m_line }}\" hint-placeholder-val=\"{{ false }}\">\n      <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Mặt hàng *<\u002Flabel><sc-raw-select name=\"itemId\" value=\"{{ form.itemId }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px;background:#fff\"><option value=\"\">— Chọn —<\u002Foption><sc-for list=\"{{ sellable }}\" as=\"i\" hint-placeholder-count=\"2\"><option value=\"{{ i.id }}\">{{ i.code }} · {{ i.name }} ({{ i.unit }})<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n      <sc-if value=\"{{ formLineItem }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:14px;color:#6B655B\">Mặc định: {{ formLineItem.unit }}, giá {{ formLineItem.price }} đ/{{ formLineItem.priceUnit }}. Giá nhập dưới đây được lưu riêng cho đơn.<\u002Fdiv><\u002Fsc-if>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n        <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Số lượng *<\u002Flabel><input name=\"qty\" type=\"number\" inputmode=\"decimal\" value=\"{{ form.qty }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n        <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Đơn vị (kg / cặp / cái)<\u002Flabel><input name=\"unit\" value=\"{{ form.unit }}\" sc-camel-on-change=\"{{ onField }}\" placeholder=\"theo mặt hàng\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n        <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Đơn giá (đ)<\u002Flabel><input name=\"price\" type=\"number\" inputmode=\"numeric\" value=\"{{ form.price }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n        <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Giá tính theo<\u002Flabel><input name=\"priceUnit\" value=\"{{ form.priceUnit }}\" sc-camel-on-change=\"{{ onField }}\" placeholder=\"theo mặt hàng\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Mã hàng của khách<\u002Flabel><input name=\"custCode\" value=\"{{ form.custCode }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n      <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Thông số / mẫu duyệt<\u002Flabel><input name=\"spec\" value=\"{{ form.spec }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n      <label style=\"display:flex;gap:10px;align-items:center;min-height:44px;font-size:15px\"><input type=\"checkbox\" name=\"tentative\" checked=\"{{ form.tentative }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:22px;height:22px\">Giá/số lượng còn tạm tính (chưa chốt với khách)<\u002Flabel>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ m_terms }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n        <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Ngày giao cuối<\u002Flabel><input name=\"deliveryDate\" type=\"date\" value=\"{{ form.deliveryDate }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n        <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Số PO khách (nếu có)<\u002Flabel><input name=\"customerPoRef\" value=\"{{ form.customerPoRef }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Thỏa thuận thanh toán<\u002Flabel><textarea name=\"paymentTerms\" value=\"{{ form.paymentTerms }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"2\" placeholder=\"VD: ứng 20% trước, còn lại trong 3 ngày sau mỗi hóa đơn\" style=\"width:100%;border:1px solid #CFC9BE;border-radius:10px;padding:10px 12px;font-size:16px;resize:vertical\"><\u002Ftextarea><\u002Fdiv>\n      <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Kế hoạch giao — mỗi dòng: số lượng, ngày (dd/mm/yyyy)<\u002Flabel><textarea name=\"planned\" value=\"{{ form.planned }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"3\" placeholder=\"400 kg, 06/10/2026\n600 kg, 08/10/2026\" style=\"width:100%;border:1px solid #CFC9BE;border-radius:10px;padding:10px 12px;font-size:16px;resize:vertical\"><\u002Ftextarea><\u002Fdiv>\n      <label style=\"display:flex;gap:10px;align-items:center;min-height:44px;font-size:15px\"><input type=\"checkbox\" name=\"agreed\" checked=\"{{ form.agreed }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:22px;height:22px\">Điều khoản đã chốt với khách (không còn tạm thời)<\u002Flabel>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ m_confirm }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:15px\">Xác nhận là hành động riêng của người dùng. PO khách đính kèm không tự xác nhận đơn. Sau xác nhận, mã <b>{{ confirmOrderM.ref }}<\u002Fb> giữ nguyên; giá và thông số dòng hàng được giữ như đã chốt.<\u002Fdiv>\n      <sc-if value=\"{{ confirmOrderM.canConfirm }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:#E3F3EC;color:#0F6E56;border-radius:10px;padding:10px 12px;font-weight:600\">Đủ thông tin tối thiểu: khách, dòng hàng có giá, ngày giao, thỏa thuận thanh toán, điều khoản đã chốt.<\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ confirmOrderM.canConfirm }}\" hint-placeholder-val=\"{{ true }}\"><\u002Fsc-if>\n      <sc-for list=\"{{ confirmOrderM.missing }}\" as=\"m\" hint-placeholder-count=\"0\"><div style=\"background:#FBE4E1;color:#A3261A;border-radius:10px;padding:8px 12px;font-weight:600\">Thiếu: {{ m }}<\u002Fdiv><\u002Fsc-for>\n      <sc-for list=\"{{ confirmOrderM.warnings }}\" as=\"w\" hint-placeholder-count=\"0\"><div style=\"font-size:14px;color:#6B655B\">Lưu ý: {{ w }}<\u002Fdiv><\u002Fsc-for>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ m_cancel }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:15px\">Hủy là kết quả kinh doanh, khác với lưu trữ. Hồ sơ và lịch sử vẫn được giữ.<\u002Fdiv>\n      <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Lý do *<\u002Flabel><input name=\"reason\" value=\"{{ form.reason }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ m_production }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:14px;color:#6B655B\">Điều phối cơ bản: ngày hẹn, người phụ trách, số đã sẵn (nhập tay) và điểm vướng. Không có kế hoạch MRP hay quy đổi hạt → quai tự độ e=\"{{ form.date }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n        <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Đơn giá<\u002Flabel><input name=\"price\" type=\"number\" value=\"{{ form.price }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ m_delivery }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:14px;color:#6B655B\">Ghi đợt giao thực tế. Không yêu cầu thanh toán trước. Kho thành phẩm sẽ giảm tương ứng.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n        <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Số lượng *<\u002Flabel><input name=\"qty\" type=\"number\" value=\"{{ form.qty }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n        <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Ngày *<\u002Flabel><input name=\"date\" type=\"date\" value=\"{{ form.date }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n        <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Hình thức<\u002Flabel><sc-raw-select name=\"type\" value=\"{{ form.type }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px;background:#fff\"><option>Giao tận nơi<\u002Foption><option>Khách tự lấy<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n        <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Ảnh phiếu xuất kho (tên tệp, mô phỏng)<\u002Flabel><input name=\"slip\" value=\"{{ form.slip }}\" sc-camel-on-change=\"{{ onField }}\" placeholder=\"phieu-xuat.jpg\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Ghi chú<\u002Flabel><input name=\"note\" value=\"{{ form.note }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ m_issue }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:14px;color:#6B655B\">Ghi nhận thông tin hóa đơn kế toán đã phát hành (theo chứng từ gửi về). Không áp thuế suất; tổng tiền nhập theo hóa đơn thật.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n        <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Số hóa đơn *<\u002Flabel><input name=\"ref\" value=\"{{ form.ref }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n        <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Tổng tiền theo HĐ *<\u002Flabel><input name=\"amount\" type=\"number\" value=\"{{ form.amount }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n        <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Hạn thanh toán (theo thỏa thuận)<\u002Flabel><input n E;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n        <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Giá mặc định (đ)<\u002Flabel><input name=\"price\" type=\"number\" value=\"{{ form.price }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Mã hàng của khách (nếu có)<\u002Flabel><input name=\"custCode\" value=\"{{ form.custCode }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n      <div><label style=\"display:block;font-size:14px;color:#6B655B;font-weight:600;margin-bottom:6px\">Thông số / mẫu duyệt<\u002Flabel><input name=\"spec\" value=\"{{ form.spec }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;min-height:46px;border:1px solid #CFC9BE;border-radius:10px;padding:0 12px;font-size:16px\"><\u002Fdiv>\n      <div style=\"font-size:13px;color:#8A8477\">Đổi giá mặc định không ảnh hưởng dòng hàng đã chốt trên các đơn.<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ err }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:#FBE4E1;color:#A3261A;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600\">{{ err }}<\u002Fdiv><\u002Fsc-if>\n    <div style=\"display:flex;gap:10px;justify-content:flex-end;padding-top:4px\"><button sc-camel-on-click=\"{{ close }}\" style=\"background:#fff;border:1px solid #CFC9BE;border-radius:10px;min-height:46px;padding:0 16px;font-size:16px;font-weight:600;cursor:pointer\">Hủy<\u002Fbutton><button sc-camel-on-click=\"{{ submit }}\" style=\"background:#0F6E56;color:#fff;border:none;border-radius:10px;min-height:46px;padding:0 20px;font-size:16px;font-weight:600;cursor:pointer\">{{ submitLabel }}<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;animation:vtpfade .2s ease\"><div style=\"{{ toast.style }}\">{{ toast.text }}<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;demoDay&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026-10-06&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Dữ liệu mẫu&quot;,&quot;description&quot;:&quot;Ngày 'hôm nay' của bản thử (YYYY-MM-DD). Đổi để xem trễ giao / quá hạn thay đổi.&quot;},&quot;defaultAccount&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;A1&quot;,&quot;options&quot;:[&quot;A1&quot;,&quot;A2&quot;,&quot;A3&quot;,&quot;P1&quot;,&quot;P2&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Dữ liệu mẫu&quot;,&quot;description&quot;:&quot;Tài khoản mặc định khi ghi chuyển khoản mới&quot;}}\">\nclass Component extends DCLogic {\n  state = { loading: true, data: null, user: null, screen: 'today', param: null, q: '', ordFilter: 'all', dirTab: 'clients', stockItem: null, moneyTab: 'all', modal: null, form: {}, err: '', toast: null, login: { user: '', pass: '', err: '' }, compare: null, preview: null };\n  async componentDidMount() {\n    const [D, L] = await Promise.all([import((window.__resources && window.__resources.vtpData) || './vtp-data.js'), import((window.__resources && window.__resources.vtpLogic) || './vtp-logic.js')]);\n    this.D = D; this.L = L;\n    let data = null; try { const raw = localStorage.getItem(L.KEY); if (raw) data = JSON.parse(raw); } catch (e) {}\n    if (!data || !data.seq) data = D.seed();\n    let user = null; try { user = JSON.parse(localStorage.getItem(L.UKEY) || 'null'); } catch (e) {}\n    this.setState({ data, user, loading: false });\n  }\n  get T() { const v = this.props.demoDay; return /^\\d{4}-\\d{2}-\\d{2}$/.test(v || '') ? v : (this.L ? this.L.TODAY : '2026-10-06'); }\n  persist(data, msg) { try { localStorage.setItem(this.L.KEY, JSON.stringify(data)); } catch (e) {} this.setState({ data, modal: null, err: '' }); if (msg) this.toast(msg); }\n  toast(text, kind) { clearTimeout(this._tt); this.setState({ toast: { text, kind: kind || 'ok' } }); this._tt = setTimeout(() => this.setState({ toast: null }), 3000); }\n  clone() { return JSON.parse(JSON.stringify(this.state.data)); }\n  nid(d, p) { const n = d.seq[p] || 1; d.seq[p] = n + 1; return p + n; }\n  stamp() { const t = new Date(); return this.T + ' ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0'); }\n  who() { return this.state.user ? this.state.user.name : '?'; }\n  go = (screen, param) => { this.setState({ screen, param: param || null, modal: null, err: '', preview: null }); window.scrollTo(0, 0); };\n  open = (modal, form) => this.setState({ modal, form: form || {}, err: '' });\n  close = () => this.setState({ modal: null, err: '' });\n  onField = e => { const t = e.target; const v = t.type === 'checkbox' ? t.checked : t.value; this.setState(s => ({ form: { ...s.form, [t.name]: v } })); };\n  onLogin = e => { const t = e.target; this.setState(s => ({ login: { ...s.login, [t.name]: t.value, err: '' } })); };\n  doLogin(u, p) { const user = this.state.data.users.find(x => x.user === u && x.pass === p); if (!user) { this.setState(s => ({ login: { ...s.login, err: 'Sai tên đăng nhập hoặc mật khẩu. Tài khoản mẫu: me / demo.' } })); return; } try { localStorage.setItem(this.L.UKEY, JSON.stringify(user)); } catch (e) {} this.setState({ user, screen: 'today', login: { user: '', pass: '', err: '' } }); }\n  submitLogin = e => { e.preventDefault(); this.doLogin(this.state.login.user.trim(), this.state.login.pass); };\n  logout = () => { try { localStorage.removeItem(this.L.UKEY); } catch (e) {} this.setState({ user: null, screen: 'today', param: null, modal: null }); };\n  resetDemo = () => { if (!window.confirm('Đặt lại toàn bộ dữ liệu mẫu về ban đầu?')) return; const data = this.D.seed(); this.persist(data, 'Đã đặt lại dữ liệu mẫu'); this.go('today'); };\n  unavailable = () => this.toast('Chức năng minh họa — chưa có trong bản thử nghiệm', 'info');\n  ord(d, id) { return d.orders.find(o => o.id === (id || this.state.param)); }\n  hist(o, text) { o.history.push({ at: this.stamp(), by: this.who(), text }); }\n  fail(msg) { this.setState({ err: msg }); }\n\n  // ---- Orders\n  createDraft = () => { const f = this.state.form; if (!f.clientId) return this.fail('Chọn khách hàng trước khi lưu nháp.'); const d = this.clone(); const n = d.seq.O++; const o = { id: 'O' + n, ref: 'SO-DEMO-' + String(n).padStart(3, '0'), clientId: f.clientId, step: 'draft', state: 'active', substep: 'Đang trao đổi', createdAt: this.T, confirmedAt: '', customerPoRef: '', note: f.note || '', terms: { deliveryDate: '', paymentTerms: '', agreed: false }, lines: [], plannedDeliveries: [], production: { readyDate: '', role: '', readyQty: 0, blocker: '' }, attachments: [], history: [{ at: this.stamp(), by: this.who(), text: 'Tạo nháp' + (f.note ? ': ' + f.note : '.') }] }; d.orders.push(o); this.persist(d, 'Đã lưu nháp ' + o.ref); this.go('order', o.id); };\n  addNote = () => { const f = this.state.form; if (!f.text || !f.text.trim()) return this.fail('Nhập nội dung ghi chú.'); const d = this.clone(); const o = this.ord(d); this.hist(o, f.text.trim()); if (f.substep) o.substep = f.substep; this.persist(d, 'Đã thêm ghi chú'); };\n  addLine = () => { const f = this.state.form; const d = this.clone(); const o = this.ord(d); const it = d.catalog.find(x => x.id === f.itemId); const qty = +f.qty, price = +f.price; if (!it) return this.fail('Chọn mặt hàng.'); if (!(qty > 0)) return this.fail('Số lượng phải lớn hơn 0 (đơn vị: ' + it.unit + ').'); o.lines.push({ id: this.nid(d, 'L'), itemId: it.id, code: it.code, custCode: f.custCode || it.custCode, name: it.name, spec: f.spec || it.spec, qty, unit: f.unit || it.unit, price: price || 0, priceUnit: f.priceUnit || it.priceUnit, tentative: !!f.tentative }); this.hist(o, `Thêm dòng ${it.code} ${qty} ${f.unit || it.unit} × ${price || 0} đ/${f.priceUnit || it.priceUnit}${f.tentative ? ' (tạm tính)' : ''}`); this.persist(d, 'Đã thêm dòng hàng — giá được lưu riêng cho đơn này'); };\n  removeLine = id => { const d = this.clone(); const o = this.ord(d); const l = o.lines.find(x => x.id === id); if (!l) return; if (o.step !== 'draft') return this.toast('Đơn đã xác nhận: dùng đối chiếu PO hoặc ghi chú sửa đổi thay vì xóa dòng', 'info'); o.lines = o.lines.filter(x => x.id !== id); this.hist(o, `Xóa dòng ${l.code}`); this.persist(d, 'Đã xóa dòng'); };\n  saveTerms = () => { const f = this.state.form; const d = this.clone(); const o = this.ord(d); o.terms = { deliveryDate: f.deliveryDate || '', paymentTerms: f.paymentTerms || '', agreed: !!f.agreed }; const planned = []; String(f.planned || '').split('\\n').forEach(line => { const m = line.match(/(\\d[\\d.,]*)\\D+?(\\d{2})\\/(\\d{2})\\/(\\d{4})/); if (m) planned.push({ qty: +m[1].replace(/[.,]/g, ''), date: `${m[4]}-${m[3]}-${m[2]}` }); }); o.plannedDeliveries = planned; if (f.customerPoRef !== undefined) o.customerPoRef = f.customerPoRef; this.hist(o, `Cập nhật điều khoản (${o.terms.agreed ? 'đã chốt' : 'tạm thời'}): giao ${f.deliveryDate || '—'}; ${f.paymentTerms || '—'}`); this.persist(d, 'Đã lưu điều khoản'); };\n  confirmOrder = () => { const d = this.clone(); const o = this.ord(d); const m = this.L.buildModel(d, this.T).orders.find(x => x.id === o.id); if (m.missing.length) return this.fail('Còn thiếu: ' + m.missing.join(', ')); o.step = 'confirmed'; o.confirmedAt = this.T; o.substep = 'Chờ sản xuất'; this.hist(o, 'Xác nhận đơn hàng (hành động riêng, không tự động từ PO).'); this.persist(d, 'Đã xác nhận ' + o.ref); };\n  completeOrder = () => { const d = this.clone(); const o = this.ord(d); o.step = 'completed'; o.substep = 'Giao đủ, đủ hóa đơn, thu đủ'; this.hist(o, 'Đánh dấu hoàn tất.'); this.persist(d, 'Đơn đã hoàn tất'); };\n  cancelOrder = () => { const f = this.state.form; if (!f.reason) return this.fail('Nhập lý do hủy.'); const d = this.clone(); const o = this.ord(d); o.state = 'cancelled'; this.hist(o, 'Hủy đơn: ' + f.reason); this.persist(d, 'Đã hủy đơn (vẫn giữ hồ sơ)'); };\n  archiveOrder = () => { const d = this.clone(); const o = this.ord(d); o.state = 'archived'; this.hist(o, 'Lưu trữ hồ sơ.'); this.persist(d, 'Đã lưu trữ'); };\n  saveProduction = () => { const f = this.state.form; const d = this.clone(); const o = this.ord(d); o.production = { readyDate: f.readyDate || '', role: f.role || '', readyQty: +f.readyQty || 0, blocker: f.blocker || '' }; this.hist(o, `Sản xuất: hẹn sẵn ${this.L.fmtD(f.readyDate)}, ${f.role || '—'}, sẵn ${f.readyQty || 0}${f.blocker ? '; vướng: ' + f.blocker : ''}`); this.persist(d, 'Đã cập nhật sản xuất (không tự tính tiêu hao)'); };\n\n  // ---- Customer PO attachment + compare (simulated extraction)\n  attachPo = () => { const f = this.state.form; if (!f.file) return this.fail('Nhập tên tệp (mô phỏng tải lên).'); if (!f.ref) return this.fail('Nhập số PO của khách.'); const d = this.clone(); const o = this.ord(d); const ver = o.attachments.filter(a => a.ref === f.ref).length + 1; const at = { id: this.nid(d, 'AT'), ref: f.ref, version: ver, file: f.file, date: this.T, by: this.who(), status: 'pending', source: f.source || 'Tải lên web', extracted: { qty: +f.qty || 0, date: f.date || '', price: +f.price || 0 } }; o.attachments.push(at); this.hist(o, `Đính kèm ${f.ref} bản ${ver} (${at.file}) — chờ đối chiếu.`); this.setState({ compare: { orderId: o.id, attId: at.id, decisions: { qty: 'accept', date: 'accept', price: 'accept' } } }); this.persist(d, 'Đã lưu tệp làm bằng chứng — chưa thay đổi đơn'); };\n  toggleDecision = k => this.setState(s => ({ compare: { ...s.compare, decisions: { ...s.compare.decisions, [k]: s.compare.decisions[k] === 'accept' ? 'retain' : 'accept' } } }));\n  applyCompare = () => { const c = this.state.compare; const d = this.clone(); const o = d.orders.find(x => x.id === c.orderId); const at = o.attachments.find(a => a.id === c.attId); const ex = at.extracted; const acc = [], ret = []; const l = o.lines[0]; if (c.decisions.qty === 'accept' && l && ex.qty && ex.qty !== l.qty) { acc.push(`SL ${l.qty}→${ex.qty} ${l.unit}`); l.qty = ex.qty; } else if (l && ex.qty !== l.qty) ret.push('số lượng'); if (c.decisions.date === 'accept' && ex.date && ex.date !== o.terms.deliveryDate) { acc.push(`ngày giao ${this.L.fmtD(o.terms.deliveryDate)}→${this.L.fmtD(ex.date)}`); o.terms.deliveryDate = ex.date; } else if (ex.date && ex.date !== o.terms.deliveryDate) ret.push('ngày giao'); if (c.decisions.price === 'accept' && l && ex.price && ex.price !== l.price) { acc.push(`giá ${l.price}→${ex.price}`); l.price = ex.price; } else if (l && ex.price && ex.price !== l.price) ret.push('đơn giá'); at.status = 'applied'; at.decisions = `Nhận: ${acc.join(', ') || 'không có'}; giữ: ${ret.join(', ') || 'không có'}`; o.customerPoRef = at.ref; this.hist(o, `Đối chiếu ${at.ref} bản ${at.version}: ${at.decisions}. Bước đơn không đổi.`); this.setState({ compare: null }); this.persist(d, 'Đã áp dụng đối chiếu — bước đơn giữ nguyên'); };\n  dismissCompare = () => { const c = this.state.compare; const d = this.clone(); const o = d.orders.find(x => x.id === c.orderId); const at = o.attachments.find(a => a.id === c.attId); at.status = 'retained'; at.decisions = 'Giữ nguyên toàn bộ điều khoản đơn'; this.hist(o, `Giữ nguyên đơn, lưu ${at.ref} bản ${at.version} làm bằng chứng.`); this.setState({ compare: null }); this.persist(d, 'Giữ nguyên đơn, tệp vẫn được lưu'); };\n  previewFile = name => this.setState({ preview: name });\n  closePreview = () => this.setState({ preview: null });\n\n  // ---- Deliveries & invoices\n  recordDelivery = () => { const f = this.state.form; const d = this.c
